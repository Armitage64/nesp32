# The numbers both ends of the link must agree on (docs/PROTOCOL.md).
#
# tools/gen_proto.py writes them out for each side: a C header for the
# Stick's firmware, a ca65 include for the console, and a Python module for
# the tools and the tests. Nothing else may restate one of them.
#
# Every name gets the prefix NESP_. A service's id is NESP_SVC_<service>,
# an op NESP_<service>_<op>, a status NESP_ST_<name>, and an enum's value
# NESP_<enum>_<name>.

[link]
PROTOCOL = 1            # what a hello says it speaks
CPU_HZ = 1789773        # NTSC: 21.477272 MHz / 12
# A rate is a whole number of CPU cycles a bit, so the console's bit-banged
# routines hit every bit exactly. 21 is 85227 baud: nes-wiki and nes-drmario
# ran at it on hardware, and nes-throughput's test passed it both
# ways with rates to spare.
PERIOD = 21
TO_NES_BITS = 11        # the Stick sends 8N2
TO_STICK_BITS = 10      # the console sends 8N1
REQUEST_MARKER = 0x4E   # 'N'
REPLY_MARKER = 0xA5
HEADER = 5              # marker, service, op or status, sequence, length
OVERHEAD = 7            # the header and the CRC's two bytes
PAYLOAD_MAX = 127       # of any frame; bit 7 of a length is always 0
REPLY_BEFORE_HELLO = 32 # the longest reply payload until a hello says more
REPLY_MIN = 16          # and the least a hello may ask for
# The check is CRC-16/CCITT-FALSE, as on nes-radar's, nes-jukebox's and
# nes-wiki's links: no reflection, no final XOR, high byte first. Its check
# value for "123456789" is 0x29B1.
CRC_POLY = 0x1021
CRC_INIT = 0xFFFF
# A short frame, for a service asked something small in every frame of a
# game: a marker whose low two bits are a count, two or three bytes, and a
# CRC. Every byte of one is 200 cycles and more of a console's frame.
SHORT_REQUEST = 0xD0
SHORT_REPLY = 0xB0
SHORT_MARK = 0xFC       # the bits of a short frame's first byte that are its marker
SHORT_DATA = 3          # the most bytes of data in one
SHORT_MAX = 6           # the longest, in bytes
SHORT_NONE = 3          # a short reply's count when nothing could answer
APP_ID = 4              # characters in a hello's application id

# A reply's status. 0 is good. Bit 7 marks an error, and bit 6 may be set on
# any reply: the Stick has an event waiting (SYS EVENT).
[status]
OK = 0x00
ATTENTION = 0x40
ERROR = 0x80
NO_SERVICE = 0x80       # this firmware has no such service
NO_OP = 0x81            # the service has no such op
BAD_ARG = 0x82          # the payload is not what the op takes
BUSY = 0x83             # not now: ask again
INACTIVE = 0x84         # the service was not asked for in a hello
NO_WIFI = 0x85
NOT_FOUND = 0x86
FAILED = 0x87
VERSION = 0x88          # the hello speaks a protocol this firmware does not

[services.SYS]
id = 0x00
[services.SYS.ops]
HELLO = 0x00            # who the ROM is and what it needs
STATUS = 0x01           # Wi-Fi, address, battery
ECHO = 0x02             # the payload, back
INFO = 0x03             # a string by number (enum INFO)
TIME = 0x04             # the time of day, if the Stick knows it
EVENT = 0x05            # the oldest event waiting
DRIVE = 0x06            # the nesp32's files as a USB drive: ask, start or stop (enum LEND)
SCREEN = 0x07           # which way up the nesp32's screen is: ask, or turn it (enum TURN)

[services.NET]
id = 0x01
[services.NET.ops]
WIFI_STATUS = 0x00
SCAN_START = 0x01
SCAN_STATUS = 0x02
SCAN_RESULT = 0x03      # one network, by its place in the list
SET_NAME = 0x04         # a piece of the network's name: offset, then bytes
SET_PASSWORD = 0x05     # a piece of the password, likewise
JOIN = 0x06             # the lengths of both, as a check, and go
FORGET = 0x07

[services.RES]
id = 0x02
[services.RES.ops]

[services.RAW]
id = 0x03
[services.RAW.ops]
SEND = 0x00             # a run of the pattern to the console, at a rate of its own
LISTEN = 0x01           # a run of it from the console, likewise
RESULT = 0x02           # how the last run went

[services.PEER]
id = 0x04
[services.PEER.ops]
STATUS = 0x00           # the lobby's state, and this nesp32's address
HOST = 0x01             # wait for the other nesp32 to call
JOIN = 0x02             # call the nesp32 at an address
LEAVE = 0x03            # drop whatever connection there is, or is being made
LAST = 0x04             # the lobby's state, and the address last joined
TICKS = 0x05            # this console's buttons for some ticks, and the other's back
HOST_ROOM = 0x06        # open a room at the rendezvous, and wait in it for the other nesp32
JOIN_ROOM = 0x07        # code (4): join the other nesp32's room
ROOM = 0x08             # the lobby's state, with the room's code and why a meeting failed

[services.DIAG]
id = 0x05
[services.DIAG.ops]
STATS = 0x00            # the Stick's counters for this link
PATTERN = 0x01          # seed (2), count: that many bytes of the pattern
SINK = 0x02             # seed (2), then bytes: how many differ from the pattern

[services.KBD]
id = 0x06
[services.KBD.ops]
STATE = 0x00            # how the keyboard stands (enum KEYBOARD), and the name of the one paired
KEYS = 0x01             # what has been typed since the last KEYS
SCAN = 0x02             # look for keyboards in their pairing mode
FOUND = 0x03            # one keyboard the scan found, by its place in the list
PAIR = 0x04             # pair with that one, in place of the one paired
FORGET = 0x05           # forget the one paired

[services.JUKE]
id = 0x10
[services.JUKE.ops]
STREAM = 0x00           # more of the music, from where the console has got to
BUTTON = 0x01           # what the console's controller asked for (enum PRESS)
SOUND = 0x02            # a sound record has played: send its samples (enum SOUND)
LIST = 0x03             # a track's game and name, for the console's menu
CHOOSE = 0x04           # play this track, from its beginning

[services.WIKI]
id = 0x11
[services.WIKI.ops]
SEARCH = 0x00           # an id, then the words: start on it, or say how it is going
LINE = 0x01             # a line of the article, by its number

[services.RADAR]
id = 0x12
[services.RADAR.ops]
AIRPORT = 0x00          # an id, then four letters: choose it, or say how it stands
SCENE = 0x01            # the aircraft round the airport, if they are not the ones the console has
IDENTITY = 0x02         # one aircraft's names, by its slot
LAST = 0x03             # the letters of the last airport found, if one is kept

[services.TUNER]
id = 0x13
[services.TUNER.ops]
STATE = 0x00            # how it stands with the station (enum TUNER), and why if it failed
PLAY = 0x01             # start on the station's stream
STOP = 0x02             # and give it up
SOUND = 0x03            # the console's rate: send the station as samples (enum SOUND)
URL = 0x04              # AT, then text: the address the next PLAY tunes in, from AT on

[services.WEATHER]
id = 0x14
[services.WEATHER.ops]
ZIP = 0x00              # an id, then five digits: choose it, or say how it stands
ROW = 0x01              # a row of the report, by its number
LAST = 0x02             # the digits of the last zip code found, if one is kept

[services.BSKY]
id = 0x15
[services.BSKY.ops]
FAVORITE = 0x00         # how many favorites there are, and one's handle by its number
ADD = 0x01              # a handle onto the favorites, kept
REMOVE = 0x02           # a favorite off them, by its number
FEED = 0x03             # an id, then a handle: fetch its posts, or say how it stands
LINE = 0x04             # a line of a post, by the post's number and the line's

[enums.WIFI]            # the state of the Stick's Wi-Fi
NONE = 0                # no network has been set up
IDLE = 1                # one is saved, and the Stick is not on it
JOINING = 2
JOINED = 3
FAILED = 4              # the last join did not work (enum WHY)

[enums.WHY]             # why a join failed
NONE = 0
PASSWORD = 1            # the network refused the password
NO_NETWORK = 2          # no network of that name was found
OTHER = 3

[enums.SCAN]
IDLE = 0
RUNNING = 1
DONE = 2
FAILED = 3

[enums.AUTH]            # a scanned network's security
OPEN = 0
PASSWORD = 1
OTHER = 2               # something this firmware cannot join (enterprise)

[enums.ARTICLE]         # WIKI: the state of a search, and two flags with it
IDLE = 0                # no article, and nothing being fetched
NO_WIFI = 1
FETCHING = 2
READY = 3               # an article is held
NOT_FOUND = 4           # the last search found no article
ERROR = 5               # the last search failed; the reply says how
STATE = 0x3F            # the state's bits
MORE = 0x40             # with READY: the article is still arriving
NO_LINE = 0x80          # on a LINE reply: no such line is held

[enums.SCOPE]           # RADAR: how it stands with the airport and its aircraft
IDLE = 0                # no airport chosen, or not the one the request is about
NO_WIFI = 1
NOT_FOUND = 2           # no airport has those letters
WAITING = 3             # the airport is known, and nothing has come of its aircraft yet
READY = 4               # a scene is held
LOOKING = 5             # where the airport is, is being asked
NO_LOOKUP = 6           # and could not be: the asking failed

[enums.SCENE]           # RADAR SCENE's flags, which are nes-radar's
STALE = 0x01            # nothing good has come for RADAR_STALE_MS
TRUNCATED = 0x02        # there were more aircraft than a scene holds
DOWN = 0x04             # the last fetch failed
BAD_DATA = 0x08
BAD_PLACE = 0x10

[enums.RUN]             # RAW: the state of a run
IDLE = 0                # none yet
ARMED = 1               # agreed, and the nesp32 is listening in case the console asks again
RUNNING = 2             # the line is the run's
DONE = 3
DROPPED = 4             # called off before it began: the console asked for something

[enums.PLAYER]          # JUKE: the state of the music, and a flag with it
STOPPED = 0             # nothing plays, and the console holds nothing
PLAYING = 1
PAUSED = 2              # held where it is; the console keeps what it has
NO_TRACKS = 3           # the nesp32 has no music
STATE = 0x0F            # the state's bits
DRAIN = 0x40            # no more is coming for now: play what you have

[enums.PRESS]           # JUKE BUTTON: bits, as the jukebox's controller gives them
NEXT = 0x01
PREVIOUS = 0x02
PLAY = 0x04             # play, or pause
STOP = 0x08             # stop: back to the console's menu

[enums.SOUND]           # JUKE SOUND's answer
WAIT = 0                # not now (paused): ask again
GO = 1                  # samples follow, as a run of RAW's
GONE = 2                # there is no such sound to play: ask for the stream

[enums.TUNER]           # TUNER: how it stands with the station
OFF = 0                 # nothing is being fetched
NO_WIFI = 1
TUNING = 2              # its stream is being fetched, and not enough has come to play
READY = 3               # enough has: ask for the sound
FAILED = 4              # the stream could not be had, or was lost; the reply says how
PAUSED = 5              # the console left the sound: held, and fetched still, until PLAY

[enums.SKY]             # WEATHER: how it stands with the zip code and its report
IDLE = 0                # no zip code chosen, or not the one the request is about
NO_WIFI = 1
LOOKING = 2             # where the zip code is, is being asked
FETCHING = 3            # that is known, and nothing has come of its weather yet
READY = 4               # a report is held
NOT_FOUND = 5           # no place has that zip code
FAILED = 6              # the asking or the fetching failed; the reply says how

[enums.FEED]            # BSKY: how it stands with a handle and its posts
IDLE = 0                # no handle chosen, or not the one the request is about
NO_WIFI = 1
FETCHING = 2            # its posts are being fetched; those laid out so far may be read
READY = 3               # all of them are held
NOT_FOUND = 4           # Bluesky has no one by that handle
FAILED = 5              # the fetch failed; the reply says how
NO_LINE = 0x80          # on a LINE reply: no such post is held

[enums.PICTURE]         # WEATHER: the pictures a row may have, four tiles each
SUN = 0
MOON = 1
PARTLY = 2              # the sun behind a cloud
CLOUD = 3
FOG = 4
RAIN = 5
SNOW = 6
STORM = 7

[enums.LOBBY]           # PEER: how it stands with the other nesp32
NO_WIFI = 0             # this one is not on a network
IDLE = 1
HOSTING = 2             # waiting for the other to call
CONNECTING = 3          # calling it
HOST = 4                # connected: it called, and this console is player 1
GUEST = 5               # connected: this one called, and this console is player 2
FAILED = 6              # the last call was not answered, or the connection was lost
MEETING = 7             # finding where this one can be reached, or asking the rendezvous

[enums.MEET]            # PEER: why a meeting at the rendezvous failed, with FAILED
NONE = 0
NO_SERVER = 1           # the rendezvous could not be asked, or said nothing that made sense
NO_ROOM = 2             # there is no room of that code
MISMATCH = 3            # the room is another game's, or another version's
FULL = 4                # player 2 is already in the room
UNREACHABLE = 5         # the two were introduced, and could not reach each other
GONE = 6                # the room was given up while its host waited

[enums.INFO]            # SYS INFO's strings
FIRMWARE = 0            # "0.1.0"
BOARD = 1               # "StickC Plus2"
NETWORK = 2             # the name of the saved network
APP = 3                 # the application id of the last hello

[enums.BOARD]
UNKNOWN = 0
PLUS2 = 1
S3 = 2
HOST = 3                # a computer standing in for a Stick

[enums.LEND]            # SYS DRIVE: what is asked of the drive
ASK = 0                 # only how it is
START = 1               # lend the files to a computer
STOP = 2                # take them back: the nesp32 restarts

[enums.DRIVE]           # and how it is
NONE = 0                # this board cannot be one
OFF = 1
WAITING = 2             # it is one, and no computer has taken it
MOUNTED = 3             # a computer has it
EJECTED = 4             # the computer has let it go: the nesp32 is about to restart

[enums.TURN]            # SYS SCREEN: what is asked of the screen
ASK = 0                 # only which way up it is
UPRIGHT = 1             # M5Stack's landscape
FLIPPED = 2             # the same, a half turn round

[enums.SCREEN]          # and which way up it is
NONE = 0                # this firmware cannot turn it
UPRIGHT = 1
FLIPPED = 2

[enums.EVENT]
NONE = 0
BUTTON_A = 1
BUTTON_B = 2
BUTTON_POWER = 3

[enums.KEYBOARD]        # KBD: how the Bluetooth keyboard stands
NONE = 0                # this board cannot have one
OFF = 1                 # Bluetooth is starting
UNPAIRED = 2            # on, and no keyboard is paired
WAITING = 3             # a keyboard is paired, and is not connected: a key wakes it
CONNECTED = 4           # and is: what is typed comes in KEYS
SCANNING = 5
SCANNED = 6             # the scan is over: FOUND has what it found
PAIRING = 7
FAILED = 8              # the last pairing did not work

[enums.KEY]             # KBD KEYS: what is not a printable character ($20 to $7E)
BACKSPACE = 0x08
TAB = 0x09
ENTER = 0x0A
UP = 0x11
DOWN = 0x12
LEFT = 0x13
RIGHT = 0x14
ESCAPE = 0x1B

[sizes]
NAME_MAX = 32           # a network's name
PASSWORD_MAX = 63       # WPA2's longest passphrase
SCAN_MAX = 20           # networks a scan keeps, strongest first
EVENT_QUEUE = 8
KBD_KEYS_MAX = 16       # characters in one KEYS reply
KBD_FOUND_MAX = 8       # keyboards a scan keeps, strongest first
KBD_NAME_MAX = 24       # characters of a keyboard's name
WIKI_COLUMNS = 28       # characters in a line of an article
WIKI_QUERY_MAX = 30     # characters in a search
WIKI_EARLY = 28         # lines laid out before an article is offered
# RAW: a run's times, in milliseconds from the reply that agreed to it.
RAW_LISTEN_MS = 100     # the nesp32 listens this long for the console asking again
RAW_SETTLE_MS = 150     # the console is listening, or sending, from here
RAW_START_MS = 175      # the nesp32's first byte
RAW_REST_MS = 30        # after a run's last byte, before the console asks anything
RAW_QUIET_MS = 20       # a run from the console is over when this long passes with no byte
RAW_GIVE_UP_MS = 1000   # or this long with none at all
RAW_PERIOD_MIN = 5      # the fastest rate a run may ask for, in CPU cycles a bit
JUKE_TITLE_MAX = 28     # characters in a name on the console's screen
JUKE_LIST_MAX = 255     # tracks a console's menu can count; any more are not in it
JUKE_SOUND_RATES = 7    # the rates a sound may have: 21, 16, 14, 12, 10, 8 and 7 cycles a bit
JUKE_SOUND_REFUSED = 0xFF   # JUKE SOUND's rate from a console that cannot play it
JUKE_SOUND_LAST = 0xFC  # the byte that ends a sound and leaves the console's DAC at 0
JUKE_HEARD = 4          # bytes from the console during a sound that pause it
SOUND_SAY = 8           # bytes a console sends, at the link's rate, to say it has left a sound
SOUND_TRACKED = 8       # a sound at this many cycles a bit or fewer has a tracking receiver,
SOUND_LEAD = 8          # which settles on this many bytes of $FF before the samples
TUNER_MODE_HIGH = 0     # TUNER PLAY's mode: the station at its best rate, and nothing else
TUNER_MODE_NEWS = 1     # at a rate that leaves the console time to draw, with the headlines
TUNER_RATE = 6          # the rate a station is sent at, as JUKE's sounds count them: 7 cycles a bit
TUNER_PERIOD = 7        # which is 23244 samples a second
TUNER_NEWS_RATE = 2     # and with the headlines: 14 cycles a bit,
TUNER_NEWS_PERIOD = 14  # which is 11622
TUNER_NEWS_PAGES = 16   # headlines kept, a page each
TUNER_NEWS_ROWS = 9     # lines to a page: the headline, a blank line, and of its summary what fits
TUNER_NEWS_COLUMNS = 28 # characters to a line
TUNER_NEWS_TURN_MS = 30000  # a page is shown this long
# The headlines go to the console in the eighth bit of the station's samples,
# which its DAC has no use for, a character to eight of them, the first
# bit first. A character of a page is ASCII, $20 to $5F; the rest are:
TUNER_NEWS_END = 0x00   # the sound is over (as is any below $20 but the next two)
# These two have three 1s each: a nesp32 that starts up frees a console left
# in a sound with long lows, which must not be taken for either.
TUNER_NEWS_HOME = 0x15  # a page follows, from its first character
TUNER_NEWS_SHOW = 0x1A  # the page is whole: draw it, and show it
TUNER_NEWS_IDLE = 0xFF  # nothing: what the bit is at rest
TUNER_TEXT_MAX = 28     # characters in why a station failed, for the console's screen
TUNER_URL_MAX = 255     # characters in a station's address, which URL sets
TUNER_READY_MS = 2000   # this much of a station is held before it is offered
TUNER_HEARD = 4         # bytes from the console during a station's sound that pause it
RADAR_TARGETS_MAX = 8   # aircraft in a scene, the nearest first
RADAR_MOTION_LEN = 9    # bytes of one in a scene
RADAR_NAMES_LEN = 25    # and of its names
RADAR_POLL_MS = 8000    # between one fetch of the aircraft and the next
RADAR_STALE_MS = 30000  # a scene is stale when nothing good has come for this long
RADAR_UNASKED_MS = 30000    # no fetch for a console that has not asked for this long
WEATHER_ROWS = 13       # rows of a report
WEATHER_COLUMNS = 28    # characters to a row
WEATHER_ZIP_LEN = 5     # digits in a zip code
WEATHER_PLACE_MAX = 22  # characters of a place's name: a row, less a zip code and a space
WEATHER_DAYS = 5        # days in a report, today the first
# A row is tile numbers: ASCII, $20 to $5F, and besides those
WEATHER_DEGREE = 0x1F   # the sign for degrees
WEATHER_PICTURE = 0x60  # a quarter of a picture: this, and 4 x its PICTURE, and 0 to 3:
                        # top left, top right, bottom left, bottom right
WEATHER_POLL_MS = 900000    # between one fetch of the weather and the next
WEATHER_RETRY_MS = 60000    # or this, after one that failed
WEATHER_UNASKED_MS = 30000  # no fetch for a console that has not asked for this long
BSKY_HANDLE_MAX = 27    # characters of a handle: with an "@" before it, a line
BSKY_FAVORITES = 10     # handles kept
BSKY_POSTS = 25         # posts fetched, the newest first
BSKY_ROWS = 20          # lines to a post: these two, then its text, which may not fill the rest
BSKY_HANDLE_ROW = 0     # "@" and its author's handle
BSKY_WHEN_ROW = 1       # when it was posted, and its counts
BSKY_TEXT_ROW = 2
BSKY_COLUMNS = 24       # characters to a line, as ConnectedNES had a tweet's
# A line is ASCII, $20 to $7E. Besides those:
BSKY_REPLY = 0x1C       # the sign for replies
BSKY_REPOST = 0x1D      # for reposts
BSKY_LIKE = 0x1E        # for likes: a heart
PEER_PORT = 6502        # UDP, on the nesp32 that hosts
PEER_VERSION = 1        # of what two nesp32s say to each other
PEER_PER_FRAME = 2      # ticks of buttons a TICKS frame may carry, each way
PEER_GREET_MS = 2000    # how long the other nesp32 has to say what it is
PEER_CODE = 4           # letters of a room's code
PEER_POLL_MS = 2000     # how often a host in a room asks whether player 2 has come
PEER_POLL_FAILS = 5     # asks in a row that fail before the host gives up
PEER_CANDIDATES = 4     # addresses a nesp32 may be reached at, at most
# The delay between a button and the game, in ticks, which each console
# keeps for its own buttons and its nesp32 advises it on.
PEER_DELAY_MAX = 5
PEER_DELAY_UNKNOWN = 2  # the advice before the network's time is known
PEER_TUNE = 3           # a short TICKS frame's count when it carries the console's report
PEER_COVER = 90         # the share of the network's times, in percent, that the delay is to cover
PEER_UP = 2             # reports in a row that call for a longer delay before it is advised
PEER_CALM = 8           # and for a shorter one
PEER_FEW = 20           # fewer measurements than this in a report say nothing
