# The cartridge's menu: its last 16 KB of PRG, which the MMC1 has at $C000
# when the power comes on. STUB is where every program's reset vector
# points (nes/cart/gen_cart.py).
MEMORY {
    ZP:      start = $0000, size = $0100, type = rw;
    RAM:     start = $0300, size = $0500, type = rw;
    PRG:     start = $C000, size = $4000, file = %O, fill = yes, fillval = $FF;
}

SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp;
    BSS:      load = RAM,     type = bss, define = yes;
    CODE:     load = PRG,     type = ro;
    RODATA:   load = PRG,     type = ro;
    RXTX:     load = PRG,     type = ro, align = $100;
    STUB:     load = PRG,     type = ro, start = $FFDA;
    VECTORS:  load = PRG,     type = ro, start = $FFFA;
}
