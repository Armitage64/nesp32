# The rendezvous for nesp32's PEER (README.md). Deployed with
# `npx wrangler deploy`, to https://nesp32-rendezvous.<subdomain>.workers.dev.
name = "nesp32-rendezvous"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed, which is what the Free plan's Durable Objects are.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
