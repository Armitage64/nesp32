# The web site: the product page, the cartridge and the games' ROM patches
# to download, and the page that flashes a nesp32 from a browser, put on
# GitHub Pages.
#
# The firmware and the cartridge are the latest release's, as its GitHub
# release has them: nothing is built here, and a change to the firmware
# reaches the site only by a release (release.yml, which runs this when
# it is done). The pages and the ROM patches are main's, and go up when
# they change, with no release.

name: Web site

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "apps/*/dist/**"
      - "docs/cart-menu.png"
      - "apps/*/docs/*.png"
      - "nes/lib/logo.py"
      - "tools/gen_web.py"
      - "tools/version.py"
      - ".github/workflows/web.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits for the one under way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The patches' day is their last commit's, which wants the history.
          fetch-depth: 0
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the latest release
        run: |
          mkdir -p build/release
          gh release download --dir build/release --pattern 'nesp32-*'
          gh release view --json tagName,publishedAt,url > build/release/release.json

      - name: Build the site
        run: python tools/gen_web.py build/web --release build/release

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
