# The game's bank of the netplay ROM: the first 32 KB of its PRG. The reset
# code stays at FF00, and the two pages before it, which the game's unused
# samples had, are empty: the link's library and a session's frame are in
# the menu's bank (menu.cfg).
MEMORY {
    MEM_FF: start = $8000, size = $8000, fill = yes, fillval = $FF;
}

SEGMENTS {
    BANK_FF:        load = MEM_FF, align = $8000;
    DPCM:           load = MEM_FF, start = $FF00;
    VECTORS:        load = MEM_FF, start = $FFFA;
}
