# The game's bank of the netplay ROM: the first 32 KB of its PRG.
#
# The link's library keeps its memory where the game keeps none (ZP, RAM),
# and menu.cfg says the same, so that both banks' copies agree. Its serial
# routines have the page the game's unused samples had, with the rest of
# it behind them; the reset code stays at FF00.
MEMORY {
    ZP:     start = $00B0, size = $0010, file = "";
    RAM:    start = $0330, size = $0050, file = "";
    MEM_FF: start = $8000, size = $8000, fill = yes, fillval = $FF;
}

SEGMENTS {
    ZEROPAGE:       load = ZP, type = zp;
    BSS:            load = RAM, type = bss;
    BANK_FF:        load = MEM_FF, align = $8000;
    RXTX:           load = MEM_FF, start = $FD00;
    CODE:           load = MEM_FF;
    DPCM:           load = MEM_FF, start = $FF00;
    VECTORS:        load = MEM_FF, start = $FFFA;
}
