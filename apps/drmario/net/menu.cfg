# The menu's bank: the second 32 KB of the netplay ROM's PRG.
MEMORY {
    PRG:    start = $8000, size = $8000, fill = yes, fillval = $FF;
}

SEGMENTS {
    CODE:       load = PRG, start = $8000;
    SERIAL:     load = PRG, align = $100;
    COMMON:     load = PRG, start = $FF00;
    VECTORS:    load = PRG, start = $FFFA;
}
