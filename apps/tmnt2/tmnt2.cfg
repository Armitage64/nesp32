# TMNT II as the ROM has it: an MMC3 with 32 8 KB banks of PRG and the
# CHR ROM after them. Each bank is linked at the address the game runs it
# at: an even one at $8000, an odd one at $A000, and the last two fixed at
# $C000 and $E000.

MEMORY {
    ZEROPAGE: start = $00,   size = $100,  type = rw;
    RAM:      start = $100,  size = $700,  type = rw, fill = no;
    HEADER:   start = $0000, size = $10,   fill = yes;
    PRG00:    start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG01:    start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG02:    start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG03:    start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG04:    start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG05:    start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG06:    start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG07:    start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG08:    start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG09:    start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG10:    start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG11:    start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG12:    start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG13:    start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG14:    start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG15:    start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG16:    start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG17:    start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG18:    start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG19:    start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG20:    start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG21:    start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG22:    start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG23:    start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG24:    start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG25:    start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG26:    start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG27:    start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG28:    start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG29:    start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG30:    start = $C000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG31:    start = $E000, size = $2000, type = ro, fill = yes, fillval = $FF;
    CHR:      start = $0000, size = $40000, fill = yes;
}

SEGMENTS {
    HEADER: load = HEADER, type = ro;
    BANK00: load = PRG00, type = ro;
    BANK01: load = PRG01, type = ro;
    BANK02: load = PRG02, type = ro;
    BANK03: load = PRG03, type = ro;
    BANK04: load = PRG04, type = ro;
    BANK05: load = PRG05, type = ro;
    BANK06: load = PRG06, type = ro;
    BANK07: load = PRG07, type = ro;
    BANK08: load = PRG08, type = ro;
    BANK09: load = PRG09, type = ro;
    BANK10: load = PRG10, type = ro;
    BANK11: load = PRG11, type = ro;
    BANK12: load = PRG12, type = ro;
    BANK13: load = PRG13, type = ro;
    BANK14: load = PRG14, type = ro;
    BANK15: load = PRG15, type = ro;
    BANK16: load = PRG16, type = ro;
    BANK17: load = PRG17, type = ro;
    BANK18: load = PRG18, type = ro;
    BANK19: load = PRG19, type = ro;
    BANK20: load = PRG20, type = ro;
    BANK21: load = PRG21, type = ro;
    BANK22: load = PRG22, type = ro;
    BANK23: load = PRG23, type = ro;
    BANK24: load = PRG24, type = ro;
    BANK25: load = PRG25, type = ro;
    BANK26: load = PRG26, type = ro;
    BANK27: load = PRG27, type = ro;
    BANK28: load = PRG28, type = ro;
    BANK29: load = PRG29, type = ro;
    BANK30: load = PRG30, type = ro;
    BANK31: load = PRG31, type = ro;
    CHR:    load = CHR,    type = ro;
}
