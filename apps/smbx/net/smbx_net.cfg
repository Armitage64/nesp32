# The netplay ROM (net/rom.asm): the hack's four banks of 16 KB and its
# CHR ROM, each where it is in the file. Banks 0, 2 and 3 are the hack's
# own, copied from baserom.nes, and place themselves (.org). Bank 1 is the
# netplay's: its code from $8000, the link library's serial routines on a
# page of their own and its CRC table.

MEMORY {
    ZEROPAGE: start = $00,   size = $100,  type = rw;
    HEADER:   start = $0000, size = $10,   fill = yes;
    PRG0:     start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG1:     start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG2:     start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG3:     start = $C000, size = $4000, type = ro, fill = yes, fillval = $FF;
    CHR:      start = $0000, size = $2000, fill = yes;
}

SEGMENTS {
    HEADER: load = HEADER, type = ro;
    BANK0:  load = PRG0, type = ro;
    CODE:   load = PRG1, type = ro;
    RXTX:   load = PRG1, type = ro, align = $100;
    RODATA: load = PRG1, type = ro;
    BANK2:  load = PRG2, type = ro;
    BANK3:  load = PRG3, type = ro;
    CHR:    load = CHR,  type = ro;
}
