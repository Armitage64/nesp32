# The game's bank of the netplay ROM: the first 32 KB of its PRG, laid out
# as the original's (tetris.nes.cfg in the disassembly). The header and the
# CHR are not in it: the Makefile puts the netplay ROM's own before and
# after. The space the original leaves to unused data has the two-player
# game (unreferenced_data1) and the way to the menu's bank
# (unreferenced_data4); the link's library and a session's frame are in
# the menu's bank (menu.cfg).
MEMORY {
    ZP:     start = $0000, size = $0100, type = rw, file = "";
    RAM:    start = $0100, size = $1F00, type = rw, file = "";
    HDR:    start = $0000, size = $0010, type = ro, file = "";
    PRG:    start = $8000, size = $8000, type = ro, fill = yes, fillval = $00;
    CHR:    start = $0000, size = $4000, type = ro, file = "";
}

SEGMENTS {
    ZEROPAGE: load = ZP;
    BSS:      load = RAM, type = bss;
    HEADER:   load = HDR, type = ro;
    CHR:      load = CHR, type = ro;
    PRG_chunk1:        load = PRG, type = ro;
    unreferenced_data1:load = PRG, type = ro;
    PRG_chunk2:        load = PRG, type = ro, start = $DD00;
    unreferenced_data4:load = PRG, type = ro;
    PRG_chunk3:        load = PRG, type = ro, start = $FF00;
    VECTORS:           load = PRG, type = ro, start = $FFFA;
}
