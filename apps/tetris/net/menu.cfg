# The menu's bank: the second 32 KB of the netplay ROM's PRG. ZP and RAM
# are the link library's, where the game keeps nothing.
MEMORY {
    ZP:     start = $0020, size = $0010, file = "";
    RAM:    start = $0330, size = $0050, file = "";
    PRG:    start = $8000, size = $8000, fill = yes, fillval = $FF;
}

SEGMENTS {
    ZEROPAGE:   load = ZP, type = zp;
    BSS:        load = RAM, type = bss;
    MENU:       load = PRG, start = $8000;
    CODE:       load = PRG;
    RXTX:       load = PRG, align = $100;
    RODATA:     load = PRG, align = $100;
    COMMON:     load = PRG, start = $FF00;
    VECTORS:    load = PRG, start = $FFFA;
}
