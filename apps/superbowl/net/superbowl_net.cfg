# The netplay ROM: superbowl.cfg with twice the PRG ROM, 512 KB.
#
# The game's 8 KB banks 0 to 29 are where they were, and its fixed two,
# 30 and 31 ($C000 and $E000), are the last two in the file, where the
# MMC3 keeps them: 62 and 63. The game never picks a bank above 29
# (tests/test_console.py). Banks 30 to 61 come between, all $FF but for
# what the netplay puts in them: 30 the session and nesp32's library, which
# runs at $A000 (the NMI puts it in for as long as it needs it, and the
# NMI's own end puts the game's bank back), and 31 and 32 the menu, at
# $8000, which can call the library with both in (net/cart.inc).
#
# The game keeps its save RAM ($6000-$7FFF) full, and turns it on and off
# as it writes it, so the netplay's code runs from ROM, and its memory is
# console RAM the game leaves alone (net/net_ram.inc).
#
# The library's serial routines are on a page of their own (RXTX), and its
# CRC table on the next two (RODATA).
MEMORY {
    ZEROPAGE: start = $00, size = $100, type = rw;
    HEADER: start = $0000, size = $0010, file = %O, fill = yes;
    PRG0: start = $8000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG1: start = $A000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG2: start = $A000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG3: start = $A000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG4: start = $A000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG5: start = $A000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG6: start = $A000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG7: start = $A000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG8: start = $A000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG9: start = $A000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG10: start = $8000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG11: start = $A000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG12: start = $A000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG13: start = $A000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG14: start = $A000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG15: start = $A000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG16: start = $8000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG17: start = $A000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG18: start = $8000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG19: start = $A000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG20: start = $8000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG21: start = $A000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG22: start = $8000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG23: start = $8000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG24: start = $8000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG25: start = $8000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG26: start = $8000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG27: start = $8000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG28: start = $A000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG29: start = $A000, size = $2000, file = %O, fill = yes, fillval = $FF;
    # The netplay's own: the session and nesp32's library, then the menu.
    NET0: start = $A000, size = $2000, file = %O, fill = yes, fillval = $FF;
    NET1: start = $8000, size = $2000, file = %O, fill = yes, fillval = $FF;
    NET2: start = $8000, size = $2000, file = %O, fill = yes, fillval = $FF;
    # The sprites' flicker, quicker (net/flicker.inc): FLICKER_BANK, at $A000.
    NET3: start = $A000, size = $2000, file = %O, fill = yes, fillval = $FF;
    # 8 KB banks 34 to 61: empty.
    SPARE: start = $0000, size = $38000, file = %O, fill = yes, fillval = $FF;
    PRG30: start = $C000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG31: start = $E000, size = $2000, file = %O, fill = yes, fillval = $FF;
    CHR: start = $0000, size = $20000, file = %O, fill = yes;
}
SEGMENTS {
    HEADER: load = HEADER, type = ro;
    BANK0: load = PRG0, type = ro;
    BANK1: load = PRG1, type = ro;
    BANK2: load = PRG2, type = ro;
    BANK3: load = PRG3, type = ro;
    BANK4: load = PRG4, type = ro;
    BANK5: load = PRG5, type = ro;
    BANK6: load = PRG6, type = ro;
    BANK7: load = PRG7, type = ro;
    BANK8: load = PRG8, type = ro;
    BANK9: load = PRG9, type = ro;
    BANK10: load = PRG10, type = ro;
    BANK11: load = PRG11, type = ro;
    BANK12: load = PRG12, type = ro;
    BANK13: load = PRG13, type = ro;
    BANK14: load = PRG14, type = ro;
    BANK15: load = PRG15, type = ro;
    BANK16: load = PRG16, type = ro;
    BANK17: load = PRG17, type = ro;
    BANK18: load = PRG18, type = ro;
    BANK19: load = PRG19, type = ro;
    BANK20: load = PRG20, type = ro;
    BANK21: load = PRG21, type = ro;
    BANK22: load = PRG22, type = ro;
    BANK23: load = PRG23, type = ro;
    BANK24: load = PRG24, type = ro;
    BANK25: load = PRG25, type = ro;
    BANK26: load = PRG26, type = ro;
    BANK27: load = PRG27, type = ro;
    BANK28: load = PRG28, type = ro;
    BANK29: load = PRG29, type = ro;
    BANK30: load = PRG30, type = ro;
    BANK31: load = PRG31, type = ro;
    RXTX: load = NET0, type = ro, align = $100;
    RODATA: load = NET0, type = ro, align = $100;
    NETCODE: load = NET0, type = ro;
    CODE: load = NET0, type = ro;
    MENU: load = NET1, type = ro;
    MENU2: load = NET2, type = ro, optional = yes;
    FLICKER: load = NET3, type = ro, align = $100, optional = yes;
    CHR: load = CHR, type = ro;
}
