# The netplay ROM: contra.cfg, on an MMC3 with 8 KB of PRG RAM, and twice
# the PRG ROM.
#
# The game's banks 0 to 6 of 16 KB are where they were, each the MMC3's
# 8 KB banks 2n and 2n+1, and bank 7 is the last in the file: the MMC3
# keeps its last two 8 KB banks at $C000 and $E000. Banks 8 to 15 come
# between, in seventh place to fourteenth, all $FF but for what netplay
# puts in them.
#
# Netplay's code runs from the PRG RAM ($6000), where the reset copies it
# from bank 8 (net/cart.inc): the library's serial routines on a page of
# their own (RXTX), its CRC table on the next two (RODATA), then the
# session (NETCODE) and the rest of the library (CODE). Each is aligned
# alike where it is loaded and where it runs, so the image is copied as it
# lies. What the fixed bank has to keep (CART) is in the game's space at
# its end.

MEMORY {
    ZEROPAGE: start = $00,   size = $100,   type = rw;
    RAM:      start = $100,  size = $6ff,  type = rw, fill = no;
    NETRAM:   start = $6000, size = $2000,  type = rw, file = "";

    HEADER: start = $0000, size = $0010, fill = yes;

    OAMRAM: file="", start = $0200, size = $0100, type = rw;

    BANK_0: start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    BANK_1: start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    BANK_2: start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    BANK_3: start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    BANK_4: start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    BANK_5: start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    BANK_6: start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    # Bank 8: its number, as every bank begins, and then the PRG RAM's image
    # from the next page on.
    BANK_8:     start = $8000, size = $0100, type = ro, fill = yes, fillval = $FF;
    BANK_8_RAM: start = $8100, size = $3F00, type = ro, fill = yes, fillval = $FF;
    BANK_9:  start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    BANK_10: start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    BANK_11: start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    BANK_12: start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    BANK_13: start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    BANK_14: start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    BANK_15: start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    BANK_7: start = $C000, size = $3C00, type = ro, fill = yes, fillval = $FF;
    # BANK_7 is actually still $4000 bytes large, but the hardware vectors, and
    # the NES_FOOTER, which are on BANK7, are counted separately

    # Hardware Vectors at End of 2nd 8K ROM (NES hard-coded location)
    DPCM_SAMPLES: start = $FC00, size = $03D0, type = ro, fill = no;
    NES_FOOTER: start = $FFD0, size = $002A, type = ro, fill = no;
    VECTORS: start = $FFFA, size = $0006, type = ro, fill = no;
}

# defines the order of the segments as they are stored in the .nes ROM file
SEGMENTS {
    ZEROPAGE: load = ZEROPAGE, type = zp;
    RAM: load = RAM, type = bss;
    HEADER: load = HEADER, type = ro;
    OAMRAM: load = OAMRAM, type = bss, define=yes, optional=yes;
    BANK_0: load = BANK_0, type = ro;
    BANK_1: load = BANK_1, type = ro;
    BANK_2: load = BANK_2, type = ro;
    BANK_3: load = BANK_3, type = ro;
    BANK_4: load = BANK_4, type = ro;
    BANK_5: load = BANK_5, type = ro;
    BANK_6: load = BANK_6, type = ro;
    BANK_8: load = BANK_8, type = ro;
    RXTX:    load = BANK_8_RAM, run = NETRAM, type = ro, align = $100, align_load = $100;
    RODATA:  load = BANK_8_RAM, run = NETRAM, type = ro, align = $100, align_load = $100;
    NETCODE: load = BANK_8_RAM, run = NETRAM, type = ro;
    CODE:    load = BANK_8_RAM, run = NETRAM, type = ro;
    BANK_7: load = BANK_7, type = ro;
    CART: load = BANK_7, type = ro;
    DPCM_SAMPLES: load = DPCM_SAMPLES, type = ro;
    NES_FOOTER: load = NES_FOOTER, type = ro;
    VECTORS: load = VECTORS, type = ro;
}
