# NES Radar as a part of nesp32's cartridge: one bank of PRG at $C000, with
# the two pages of CHR that are not copies of another, and padding that the
# cartridge's reset stub can be told from. The code is at $C000 as in
# cnrom256_link.cfg, so its branches cross pages where they did there; what
# that has at $8000 comes after it, the serial routines on a page each. On
# the cartridge the MMC1 has the setup ROM at $8000 (nes/cart/gen_cart.py),
# so nothing may be read from there. BANKDATA is the CN-ROM's latch values,
# which the cartridge build never writes to.
MEMORY {
    HEADER: start = $0000, size = $0010, file = %O, fill = yes;
    ZP:     start = $0000, size = $0100, type = rw;
    RAM:    start = $0200, size = $0600, type = rw;
    PRG:    start = $C000, size = $4000, file = %O, fill = yes, fillval = $FF;
    CHR:    start = $0000, size = $4000, file = %O, fill = yes, fillval = $00;
}

SEGMENTS {
    HEADER:     load = HEADER, type = ro;
    ZEROPAGE:   load = ZP,     type = zp;
    BSS:        load = RAM,    type = bss, define = yes, align = $100;
    CODE:       load = PRG,    type = ro, start = $C000;
    RODATA:     load = PRG,    type = ro;
    BANKDATA:   load = PRG,    type = ro;
    SPLASHDATA: load = PRG,    type = ro;
    RXTX:       load = PRG,    type = ro, align = $100;
    VECTORS:    load = PRG,    type = ro, start = $FFFA;
    CHR0:       load = CHR,    type = ro, start = $0000;
    CHR1:       load = CHR,    type = ro, start = $2000;
}
