# NES Radar as a part of nesp32's cartridge: nes-radar's layout, as
# cnrom256_link.cfg has it, with the two pages of CHR that are not copies
# of another, and padding that the cartridge's reset stub can be told from.
MEMORY {
    HEADER: start = $0000, size = $0010, file = %O, fill = yes;
    ZP:     start = $0000, size = $0100, type = rw;
    RAM:    start = $0200, size = $0600, type = rw;
    PRG:    start = $8000, size = $8000, file = %O, fill = yes, fillval = $FF;
    CHR:    start = $0000, size = $4000, file = %O, fill = yes, fillval = $00;
}

SEGMENTS {
    HEADER:     load = HEADER, type = ro;
    ZEROPAGE:   load = ZP,     type = zp;
    BSS:        load = RAM,    type = bss, define = yes, align = $100;
    BANKDATA:   load = PRG,    type = ro, start = $8000;
    SPLASHDATA: load = PRG,    type = ro;
    RXTX:       load = PRG,    type = ro, align = $100;
    CODE:       load = PRG,    type = ro, start = $C000;
    RODATA:     load = PRG,    type = ro;
    VECTORS:    load = PRG,    type = ro, start = $FFFA;
    CHR0:       load = CHR,    type = ro, start = $0000;
    CHR1:       load = CHR,    type = ro, start = $2000;
}
