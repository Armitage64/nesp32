# The netplay ROM: rcr.cfg, with twice the PRG ROM, and the MMC3's 8 KB of
# PRG RAM (net/cart.inc).
#
# The game's banks 0 to 6 of 16 KB are where they were, each the MMC3's
# 8 KB banks 2n and 2n+1, which the game's own switch ($FED1) picks, and
# bank 7 is the last in the file: the MMC3 keeps its last two 8 KB banks at
# $C000 and $E000. Banks 8 to 15 come between, in seventh place to
# fourteenth, all $FF but for what the netplay puts in them: bank 8 the
# netplay's code, which the reset copies into the PRG RAM at $6000
# (net_cart_start), and bank 9 the menu. The game never picks a bank above
# 6 (tests/test_console.py).
#
# The image is the library's serial routines on a page of their own
# (RXTX), its CRC table on the next two (RODATA), then the session
# (NETCODE) and the rest of the library (CODE). Each is aligned alike where
# it is loaded and where it runs, so the image is copied as it lies. What
# the fixed bank has to keep (net/cart.inc) is in its empty bytes at $F9B3
# (FILL_FREE_7_39B3).

MEMORY {
    ZEROPAGE: start = $00,   size = $100,  type = rw;
    RAM:      start = $100,  size = $700,  type = rw, fill = no;
    NETRAM:   start = $6000, size = $1800, type = rw, file = "";
    HEADER:   start = $0000, size = $10,   fill = yes;
    PRG0:     start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG1:     start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG2:     start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG3:     start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG4:     start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG5:     start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG6:     start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG8:     start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG9:     start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG10:    start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG11:    start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG12:    start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG13:    start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG14:    start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG15:    start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG7:     start = $C000, size = $4000, type = ro, fill = yes, fillval = $FF;
    CHR:      start = $0000, size = $20000, fill = yes;
}

SEGMENTS {
    HEADER:  load = HEADER, type = ro;
    BANK0:   load = PRG0, type = ro;
    BANK1:   load = PRG1, type = ro;
    BANK2:   load = PRG2, type = ro;
    BANK3:   load = PRG3, type = ro;
    BANK4:   load = PRG4, type = ro;
    BANK5:   load = PRG5, type = ro;
    BANK6:   load = PRG6, type = ro;
    RXTX:    load = PRG8, run = NETRAM, type = ro, align = $100, align_load = $100;
    RODATA:  load = PRG8, run = NETRAM, type = ro, align = $100, align_load = $100;
    NETCODE: load = PRG8, run = NETRAM, type = ro;
    CODE:    load = PRG8, run = NETRAM, type = ro;
    MENU:    load = PRG9, type = ro;
    BANK7:   load = PRG7, type = ro;
    CHR:     load = CHR, type = ro;
}
