# River City Ransom as the ROM has it: an MMC3 with 128 KB of PRG, which the
# game switches 16 KB at a time, and 128 KB of CHR ROM after it. Banks 0 to
# 6 are linked at $8000, where the game switches them, and bank 7 at $C000,
# where the MMC3 keeps the last 16 KB.

MEMORY {
    ZEROPAGE: start = $00,   size = $100,  type = rw;
    RAM:      start = $100,  size = $700,  type = rw, fill = no;
    HEADER:   start = $0000, size = $10,   fill = yes;
    PRG0:     start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG1:     start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG2:     start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG3:     start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG4:     start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG5:     start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG6:     start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG7:     start = $C000, size = $4000, type = ro, fill = yes, fillval = $FF;
    CHR:      start = $0000, size = $20000, fill = yes;
}

SEGMENTS {
    HEADER: load = HEADER, type = ro;
    BANK0:  load = PRG0, type = ro;
    BANK1:  load = PRG1, type = ro;
    BANK2:  load = PRG2, type = ro;
    BANK3:  load = PRG3, type = ro;
    BANK4:  load = PRG4, type = ro;
    BANK5:  load = PRG5, type = ro;
    BANK6:  load = PRG6, type = ro;
    BANK7:  load = PRG7, type = ro;
    CHR:    load = CHR, type = ro;
}
