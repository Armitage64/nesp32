# NROM-256 with CHR RAM: 32 KB PRG at $8000, no CHR ROM (the header asks
# for 8 KB of CHR RAM, which a picture fills), no mapper. The font is in
# PRG and is copied to CHR RAM. The serial routines take a page each.
MEMORY {
    HEADER:  start = $0000, size = $0010, file = %O, fill = yes;
    ZP:      start = $0000, size = $0100, type = rw;
    RAM:     start = $0300, size = $0500, type = rw;
    PRG:     start = $8000, size = $8000, file = %O, fill = yes, fillval = $FF;
}

SEGMENTS {
    HEADER:   load = HEADER,  type = ro;
    ZEROPAGE: load = ZP,      type = zp;
    BSS:      load = RAM,     type = bss, define = yes;
    CODE:     load = PRG,     type = ro;
    RODATA:   load = PRG,     type = ro;
    RXTX:     load = PRG,     type = ro, align = $100;
    VECTORS:  load = PRG,     type = ro, start = $FFFA;
}
