# UNROM (mapper 2), 128 KB: the pictures in banks 0 to 6 at $8000, the
# code in bank 7, fixed at $C000. 8 KB of CHR RAM.
MEMORY {
    HEADER: start = $0000, size = $0010, file = %O, fill = yes;
    ZP:     start = $0000, size = $0100, type = rw;
    RAM:    start = $0500, size = $0300, type = rw;
    BANK0:  start = $8000, size = $4000, file = %O, fill = yes, fillval = $FF;
    BANK1:  start = $8000, size = $4000, file = %O, fill = yes, fillval = $FF;
    BANK2:  start = $8000, size = $4000, file = %O, fill = yes, fillval = $FF;
    BANK3:  start = $8000, size = $4000, file = %O, fill = yes, fillval = $FF;
    BANK4:  start = $8000, size = $4000, file = %O, fill = yes, fillval = $FF;
    BANK5:  start = $8000, size = $4000, file = %O, fill = yes, fillval = $FF;
    BANK6:  start = $8000, size = $4000, file = %O, fill = yes, fillval = $FF;
    FIXED:  start = $C000, size = $4000, file = %O, fill = yes, fillval = $FF;
}

SEGMENTS {
    HEADER:   load = HEADER, type = ro;
    ZEROPAGE: load = ZP,     type = zp;
    BSS:      load = RAM,    type = bss, define = yes;
    BANK0:    load = BANK0,  type = ro;
    BANK1:    load = BANK1,  type = ro;
    BANK2:    load = BANK2,  type = ro;
    BANK3:    load = BANK3,  type = ro;
    BANK4:    load = BANK4,  type = ro;
    BANK5:    load = BANK5,  type = ro;
    BANK6:    load = BANK6,  type = ro;
    TIMED:    load = FIXED,  type = ro, start = $C000;
    CODE:     load = FIXED,  type = ro;
    VECTORS:  load = FIXED,  type = ro, start = $FFFA;
}
