# Jackal as the ROM has it: a UxROM with eight 16 KB banks of PRG and no
# CHR ROM (the game writes its tiles to the CHR RAM). Banks 0 to 6 are
# linked at $8000, where the game switches them, and bank 7 at $C000,
# where it is fixed. Each bank's source places itself (.org), so these
# only say where each goes in the file.

MEMORY {
    HEADER: start = $0000, size = $10,   fill = yes;
    PRG0:   start = $8000, size = $4000, fill = yes, fillval = $FF;
    PRG1:   start = $8000, size = $4000, fill = yes, fillval = $FF;
    PRG2:   start = $8000, size = $4000, fill = yes, fillval = $FF;
    PRG3:   start = $8000, size = $4000, fill = yes, fillval = $FF;
    PRG4:   start = $8000, size = $4000, fill = yes, fillval = $FF;
    PRG5:   start = $8000, size = $4000, fill = yes, fillval = $FF;
    PRG6:   start = $8000, size = $4000, fill = yes, fillval = $FF;
    PRG7:   start = $C000, size = $4000, fill = yes, fillval = $FF;
}

SEGMENTS {
    HEADER: load = HEADER, type = ro;
    BANK0:  load = PRG0, type = ro;
    BANK1:  load = PRG1, type = ro;
    BANK2:  load = PRG2, type = ro;
    BANK3:  load = PRG3, type = ro;
    BANK4:  load = PRG4, type = ro;
    BANK5:  load = PRG5, type = ro;
    BANK6:  load = PRG6, type = ro;
    BANK7:  load = PRG7, type = ro;
}
