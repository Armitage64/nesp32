# The netplay ROM: jackal.cfg, on an MMC3 with 8 KB of PRG RAM, and twice
# the PRG ROM (net/cart.inc).
#
# The game's banks 0 to 6 of 16 KB are where they were, each the MMC3's
# 8 KB banks 2n and 2n+1, and bank 7 is the last in the file: the MMC3
# keeps its last two 8 KB banks at $C000 and $E000. Banks 8 to 15 come
# between, in seventh place to fourteenth, all $FF but for what netplay
# puts in them: bank 8 the netplay's code, which the reset copies into the
# PRG RAM at $6000 (net_cart_reset), and bank 9 the menu.
#
# The image is the library's serial routines on a page of their own
# (RXTX), its CRC table on the next two (RODATA), then the session
# (NETCODE) and the rest of the library (CODE). Each is aligned alike where
# it is loaded and where it runs, so the image is copied as it lies. What
# the fixed bank has to keep (CART) is in the game's space at its end.

MEMORY {
    HEADER:  start = $0000, size = $10,   fill = yes;
    NETRAM:  start = $6000, size = $1800, type = rw, file = "";
    PRG0:    start = $8000, size = $4000, fill = yes, fillval = $FF;
    PRG1:    start = $8000, size = $4000, fill = yes, fillval = $FF;
    PRG2:    start = $8000, size = $4000, fill = yes, fillval = $FF;
    PRG3:    start = $8000, size = $4000, fill = yes, fillval = $FF;
    PRG4:    start = $8000, size = $4000, fill = yes, fillval = $FF;
    PRG5:    start = $8000, size = $4000, fill = yes, fillval = $FF;
    PRG6:    start = $8000, size = $4000, fill = yes, fillval = $FF;
    PRG8:    start = $8000, size = $4000, fill = yes, fillval = $FF;
    PRG9:    start = $8000, size = $4000, fill = yes, fillval = $FF;
    PRG10:   start = $8000, size = $4000, fill = yes, fillval = $FF;
    PRG11:   start = $8000, size = $4000, fill = yes, fillval = $FF;
    PRG12:   start = $8000, size = $4000, fill = yes, fillval = $FF;
    PRG13:   start = $8000, size = $4000, fill = yes, fillval = $FF;
    PRG14:   start = $8000, size = $4000, fill = yes, fillval = $FF;
    PRG15:   start = $8000, size = $4000, fill = yes, fillval = $FF;
    # Bank 7: the game's, up to the space it leaves at its end, then that
    # space, then the vectors.
    PRG7:    start = $C000, size = $3DD2, fill = yes, fillval = $FF;
    CART:    start = $FDD2, size = $0228, fill = yes, fillval = $FF;
    VECTORS: start = $FFFA, size = $0006, fill = yes;
}

SEGMENTS {
    HEADER:  load = HEADER, type = ro;
    BANK0:   load = PRG0, type = ro;
    BANK1:   load = PRG1, type = ro;
    BANK2:   load = PRG2, type = ro;
    BANK3:   load = PRG3, type = ro;
    BANK4:   load = PRG4, type = ro;
    BANK5:   load = PRG5, type = ro;
    BANK6:   load = PRG6, type = ro;
    RXTX:    load = PRG8, run = NETRAM, type = ro, align = $100, align_load = $100;
    RODATA:  load = PRG8, run = NETRAM, type = ro, align = $100, align_load = $100;
    NETCODE: load = PRG8, run = NETRAM, type = ro;
    CODE:    load = PRG8, run = NETRAM, type = ro;
    MENU:    load = PRG9, type = ro;
    BANK7:   load = PRG7, type = ro;
    CART:    load = CART, type = ro;
    VECTORS: load = VECTORS, type = ro;
}
