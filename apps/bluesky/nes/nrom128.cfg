# NROM-128: 16 KB PRG at $C000 (and again at $8000, which nothing here
# uses), 8 KB CHR, no mapper. The serial routines take a page each. On the
# cartridge the MMC1 puts this bank at $C000 and the setup ROM's first at
# $8000 (nes/cart/gen_cart.py), so nothing may be at $8000.
MEMORY {
    HEADER:  start = $0000, size = $0010, file = %O, fill = yes;
    ZP:      start = $0000, size = $0100, type = rw;
    RAM:     start = $0300, size = $0500, type = rw;
    PRG:     start = $C000, size = $4000, file = %O, fill = yes, fillval = $FF;
    CHR:     start = $0000, size = $2000, file = %O, fill = yes, fillval = $00;
}

SEGMENTS {
    HEADER:   load = HEADER,  type = ro;
    ZEROPAGE: load = ZP,      type = zp;
    BSS:      load = RAM,     type = bss, define = yes;
    CODE:     load = PRG,     type = ro;
    RODATA:   load = PRG,     type = ro;
    RXTX:     load = PRG,     type = ro, align = $100;
    VECTORS:  load = PRG,     type = ro, start = $FFFA;
    CHARS:    load = CHR,     type = ro;
}
