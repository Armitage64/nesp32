# The netplay ROM: bubblebobble.cfg, with the end of bank 6, which the game
# leaves empty, the netplay's (net/net.asm): its code from $A5A8, the link
# library's serial routines on a page of their own and its CRC table. The
# converted bank 6 stops where its empty space begins (patches/). The faster
# ways through the game's busiest routines are kept there too, and run from
# the PRG RAM, where the reset copies them (net/fast.inc).

MEMORY {
    ZEROPAGE: start = $00,   size = $100,  type = rw;
    NETRAM:   start = $6400, size = $1B00, type = rw, file = "";
    RAM:      start = $100,  size = $700,  type = rw, fill = no;
    HEADER:   start = $0000, size = $10,   fill = yes;
    PRG0:     start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG1:     start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG2:     start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG3:     start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG4:     start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG5:     start = $8000, size = $4000, type = ro, fill = yes, fillval = $FF;
    PRG6:     start = $8000, size = $25A8, type = ro, fill = yes, fillval = $FF;
    NET6:     start = $A5A8, size = $1A58, type = ro, fill = yes, fillval = $FF;
    PRG7:     start = $C000, size = $4000, type = ro, fill = yes, fillval = $FF;
    CHR:      start = $0000, size = $8000, fill = yes;
}

SEGMENTS {
    HEADER: load = HEADER, type = ro;
    BANK0:  load = PRG0, type = ro;
    BANK1:  load = PRG1, type = ro;
    BANK2:  load = PRG2, type = ro;
    BANK3:  load = PRG3, type = ro;
    BANK4:  load = PRG4, type = ro;
    BANK5:  load = PRG5, type = ro;
    BANK6:  load = PRG6, type = ro;
    CODE:   load = NET6, type = ro;
    RXTX:   load = NET6, type = ro, align = $100;
    RODATA: load = NET6, type = ro;
    FAST:   load = NET6, run = NETRAM, type = rw, define = yes;
    BANK7:  load = PRG7, type = ro;
    CHR:    load = CHR, type = ro;
}
