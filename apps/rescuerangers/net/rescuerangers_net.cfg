# The netplay ROM: rescuerangers.cfg, on an MMC3 with 8 KB of PRG RAM, and
# twice the PRG ROM.
#
# The game's banks 0 to 6 of 16 KB are where they were, each the MMC3's
# 8 KB banks 2n and 2n+1, and bank 7 is the last in the file: the MMC3
# keeps its last two 8 KB banks at $C000 and $E000. Banks 8 to 15 come
# between, in eighth place to fifteenth, all $00 but for what netplay puts
# in them.
#
# The netplay's code is in bank 8 (net/net.asm), which net_call brings in
# at $8000: the session, the menu, and the link's library, with its serial
# routines on a page of their own (RXTX) and its CRC table. What has to be
# there whatever bank the game has in runs from the PRG RAM ($6000), where
# the reset copies it from the start of bank 9 (net/cart.inc).

MEMORY {
    ZEROPAGE: start = $00,   size = $100,  type = rw;
    RAM:      start = $100,  size = $700,  type = rw, fill = no;
    NETRAM:   start = $6000, size = $1000, type = rw, file = "";
    HEADER:   start = $0000, size = $10,   fill = yes;
    PRG0:     start = $8000, size = $4000, type = ro, fill = yes, fillval = $00;
    PRG1:     start = $8000, size = $4000, type = ro, fill = yes, fillval = $00;
    PRG2:     start = $8000, size = $4000, type = ro, fill = yes, fillval = $00;
    PRG3:     start = $8000, size = $4000, type = ro, fill = yes, fillval = $00;
    PRG4:     start = $8000, size = $4000, type = ro, fill = yes, fillval = $00;
    PRG5:     start = $8000, size = $4000, type = ro, fill = yes, fillval = $00;
    PRG6:     start = $8000, size = $4000, type = ro, fill = yes, fillval = $00;
    PRG8:     start = $8000, size = $4000, type = ro, fill = yes, fillval = $00;
    # Bank 9: the PRG RAM's image, in its first 8 KB.
    PRG9:     start = $8000, size = $4000, type = ro, fill = yes, fillval = $00;
    PRG10:    start = $8000, size = $4000, type = ro, fill = yes, fillval = $00;
    PRG11:    start = $8000, size = $4000, type = ro, fill = yes, fillval = $00;
    PRG12:    start = $8000, size = $4000, type = ro, fill = yes, fillval = $00;
    PRG13:    start = $8000, size = $4000, type = ro, fill = yes, fillval = $00;
    PRG14:    start = $8000, size = $4000, type = ro, fill = yes, fillval = $00;
    PRG15:    start = $8000, size = $4000, type = ro, fill = yes, fillval = $00;
    PRG7:     start = $C000, size = $4000, type = ro, fill = yes, fillval = $00;
    CHR:      start = $0000, size = $20000, fill = yes;
}

SEGMENTS {
    HEADER:  load = HEADER, type = ro;
    BANK0:   load = PRG0, type = ro;
    BANK1:   load = PRG1, type = ro;
    BANK2:   load = PRG2, type = ro;
    BANK3:   load = PRG3, type = ro;
    BANK4:   load = PRG4, type = ro;
    BANK5:   load = PRG5, type = ro;
    BANK6:   load = PRG6, type = ro;
    CODE:    load = PRG8, type = ro;
    RXTX:    load = PRG8, type = ro, align = $100;
    RODATA:  load = PRG8, type = ro;
    NETCODE: load = PRG9, run = NETRAM, type = ro, define = yes, align = $100;
    BANK7:   load = PRG7, type = ro;
    CHR:     load = CHR, type = ro;
}
