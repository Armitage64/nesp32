# The second 32 KB of the MMC1's PRG: the first is the game's
# (tools/build_rom.py). Its last 16 KB is at $C000 at power-on, with
# `boot`; the code for $7000 is kept at $D000 for boot to copy.
# `reset_stub` is at the same place as in the game's first 16 KB.
MEMORY {
    ZP:      start = $0000, size = $0100, type = rw;
    RAMCODE: start = $7000, size = $1000, type = rw, define = yes;
    LOW:     start = $8000, size = $4000, file = %O, fill = yes, fillval = $FF;
    BOOT:    start = $C000, size = $1000, file = %O, fill = yes, fillval = $FF;
    COPY:    start = $D000, size = $1000, file = %O, fill = yes, fillval = $00, define = yes;
    HIGH:    start = $E000, size = $1FFA, file = %O, fill = yes, fillval = $FF;
    VEC:     start = $FFFA, size = $0006, file = %O, fill = yes;
}

SEGMENTS {
    STUB:     load = LOW,                type = ro, start = $B95E;
    BOOT:     load = BOOT,               type = ro;
    RXTX:     load = COPY, run = RAMCODE, type = ro, align = $100;
    CODE:     load = COPY, run = RAMCODE, type = ro;
    RODATA:   load = COPY, run = RAMCODE, type = ro;
    BSS:      load = RAMCODE,            type = bss;
    VECTORS:  load = VEC,                type = ro;
}
