# NROM-256: 32 KB PRG at $8000, 8 KB CHR, no mapper.
# The song gets $8000-$DFFF (24 KB); the player sits above it.
MEMORY {
    HEADER: start = $0000, size = $0010, file = %O, fill = yes;
    ZP:     start = $0000, size = $0100, type = rw;
    RAM:    start = $0200, size = $0200, type = rw;
    SONG:   start = $8000, size = $6000, file = %O, fill = yes, fillval = $FF;
    PRG:    start = $E000, size = $2000, file = %O, fill = yes, fillval = $FF;
    CHR:    start = $0000, size = $2000, file = %O, fill = yes, fillval = $00;
}

SEGMENTS {
    HEADER:   load = HEADER, type = ro;
    ZEROPAGE: load = ZP,     type = zp;
    BSS:      load = RAM,    type = bss, define = yes;
    SONG:     load = SONG,   type = ro, optional = yes;
    CODE:     load = PRG,    type = ro;
    RODATA:   load = PRG,    type = ro;
    RXTX:     load = PRG,    type = ro, align = $100, optional = yes;
    VECTORS:  load = PRG,    type = ro, start = $FFFA;
    CHARS:    load = CHR,    type = ro;
}
